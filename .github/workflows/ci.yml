name: CI

# F013 regression gate: the Remix admin must always compile, its routes must
# resolve (so the subscribed webhook URIs don't 404), typecheck must be clean,
# and the webhook-forwarding unit tests must pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: routes + build + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # F013: without app/routes.ts this fails ("Route config file not found"),
      # which is exactly the regression we are guarding against.
      - name: Route config resolves
        run: npx react-router routes

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test
